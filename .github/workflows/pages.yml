name: Deploy demo to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/bosshunter/web/frontend/package-lock.json
      - run: npm ci
        working-directory: src/bosshunter/web/frontend
      - run: node demo/check.mjs
      - run: npm run build
        working-directory: src/bosshunter/web/frontend
        env:
          VITE_DEMO: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/bosshunter/web/frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
